<div style="color:#333;font-family:Arial,sans-serif;">
  <div style="background-color:#0a4f8a;color:#fff;padding:14px;">
    <h1 style="font-size:18px;margin:0;">Your notification digest</h1>
  </div>
  <p>Hello&nbsp;<strong><span>{{recipientName}}</span></strong>,</p>
  <p>Here is a summary of the notifications bundled for you. Each row below is one notification, with its own subject and content.</p>
  <div class="aggregated-messages-in-adjustable-table-format" style="background-color:#e5f1fb;border-radius:8px;border:1px solid #d4e0ee;box-shadow:0 2px 8px rgba(50,50,50,0.04);font-family:Arial,sans-serif;margin:32px auto;padding:24px;">
    <table style="background-color:#fff;border-collapse:collapse;box-shadow:0 1px 2px #0001;width:100%;">
      <thead>
        <tr>
          <th style="background-color:#f3f6fa;border:1px solid #e5e7eb;font-weight:bold;padding:8px 12px;text-align:left;">Subject</th>
          <th style="background-color:#f3f6fa;border:1px solid #e5e7eb;font-weight:bold;padding:8px 12px;text-align:left;">Details</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td style="border:1px solid #e5e7eb;padding:8px 12px;"><span>{{subject}}</span></td>
          <td style="border:1px solid #e5e7eb;padding:8px 12px;"><span>{{body}}</span></td>
        </tr>
      </tbody>
    </table>
  </div>
  <p style="color:#666;font-size:0.9em;margin-top:30px;">This is an automated notification. Please do not reply to this email.</p>
</div>
<div class="image image_resized" style="clear:both;display:block;margin:0.9em auto;min-width:50px;text-align:center;box-sizing:border-box;max-width:100%;width:32.29%;"><img style="display:block;height:auto;margin:0px auto;max-width:100%;min-width:100%;width:100%;aspect-ratio:1448/1086;" src="https://corporater.com/" data-image-name="owl" width="1448" height="1086"></div>
