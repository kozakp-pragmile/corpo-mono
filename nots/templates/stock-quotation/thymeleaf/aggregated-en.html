<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <title th:remove="all">Daily Stock Quotations - Digest</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        color: #333;
      }

      .header {
        border-bottom: 2px solid #0a4f8a;
        padding-bottom: 10px;
        margin-bottom: 20px;
      }

      .header h1 {
        margin: 0;
        color: #0a4f8a;
      }

      .footer {
        margin-top: 30px;
        font-size: 0.9em;
        color: #666;
      }
    </style>
  </head>
  <body>
    <!--/*@thymesVar id="name" type="java.lang.String"*/-->
    <!--/*@thymesVar id="quotationDate" type="java.util.Date"*/-->
    <!--/*@thymesVar id="messages" type="java.util.List<com.corporater.pigeon.backend.shared.values.TemplatePartialMessage>"*/-->
    <div class="header">
      <h1>Daily Stock Quotations - Digest</h1>
      <p>
        Dear <span th:text="${name}">Investor</span>, here is your aggregated
        digest for
        <span th:text="${#dates.format(quotationDate, 'dd MMM yyyy')}"
          >07 May 2026</span
        >.
      </p>
    </div>

    <p>
      The cards below summarise the quotations of the papers you subscribed
      to.
    </p>

    <div th:each="message : ${messages}" style="background:#e5f1fb; border:1px solid #d4e0ee; border-radius:8px; margin:32px auto; padding:24px; font-family:Arial,sans-serif; box-shadow:0 2px 8px rgba(50,50,50,0.04);">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #ccd6e2; padding-bottom:12px; margin-bottom:20px;">
        <span style="font-size:1.5rem; font-weight:bold;" th:text="${message.subject}">Subject</span>
      </div>
      <div style="margin-bottom:14px; font-size:1rem;" th:utext="${message.body}">Body</div>
    </div>

    <div class="footer">
      <p>
        This is an automated notification. Please do not reply to this email.
      </p>
      <img alt="Mascot" src="cid:owl" />
    </div>
  </body>
</html>
