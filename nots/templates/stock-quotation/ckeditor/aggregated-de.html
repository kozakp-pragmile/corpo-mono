<!DOCTYPE html>
<html lang="de">
<head>
  <title>Tägliche Aktiennotierungen - Übersicht</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
</head>
<body>
<h1 style="color:#0a4f8a;">Tägliche Aktiennotierungen - Übersicht</h1>
<p>
  Sehr geehrte/r {{name}}, hier ist Ihre aggregierte Übersicht vom
  {{quotationDate}}.
</p>
<p>
  Die folgenden Karten fassen die Notierungen der von Ihnen abonnierten
  Wertpapiere zusammen.
</p>

<div class="aggregated-messages-in-adjustable-card-format">
  <div style="background:#e5f1fb; border:1px solid #d4e0ee; border-radius:8px; margin:32px auto; padding:24px; font-family:Arial,sans-serif; box-shadow:0 2px 8px rgba(50,50,50,0.04);">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #ccd6e2; padding-bottom:12px; margin-bottom:20px;">
      <span style="font-size:1.5rem; font-weight:bold;">{{subject}}</span>
    </div>
    <div style="margin-bottom:14px; font-size:1rem;">{{body}}</div>
  </div>
</div>

<p>
  Mit freundlichen Grüßen, <br/>
  <em>Das Corporater-Team</em>
</p>
<p>
  <img alt="Maskottchen" src="https://corporater.com/" data-image-name="owl" style="width:160px; height:auto;"/>
</p>
</body>
</html>
