<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title th:remove="all">Część standardowa — Typ 3 (tygodniowy) — PL</title>
  </head>
  <body>
    <!--/*@thymesVar id="recipientName" type="java.lang.String"*/-->
    <!--/*@thymesVar id="orderLabel" type="java.lang.String"*/-->
    <!--/*@thymesVar id="note" type="java.lang.String"*/-->
    <div style="border:1px solid #1f8a3a; border-radius:6px; padding:12px; margin:10px 0;">
      <p style="margin:0 0 6px; font-weight:bold; color:#1f8a3a;">
        CZĘŚĆ STANDARDOWA (STANDARD PART) · Typ powiadomienia 3 "Stock Valuation (WEEKLY)" · Język: PL
      </p>
      <p style="margin:2px 0;">Ze zlecenia (from order): <span th:text="${orderLabel}">order</span></p>
      <p style="margin:2px 0;">Dla odbiorcy (for recipient): <span th:text="${recipientName}">recipient</span></p>
      <p style="margin:2px 0;">Notatka (note): <span th:text="${note}">note</span></p>
    </div>
  </body>
</html>
