<div style="color:#333;font-family:Arial,sans-serif;">
  <div style="background-color:#0a4f8a;color:#fff;padding:14px;">
    <h1 style="font-size:18px;margin:0;">Twoje podsumowanie powiadomień</h1>
  </div>
  <p>Cześć&nbsp;<strong><span>{{recipientName}}</span></strong>,</p>
  <p>Oto podsumowanie powiadomień zebranych dla Ciebie. Każdy wiersz poniżej to jedno powiadomienie z własnym tematem i treścią.</p>
  <div class="aggregated-messages-in-adjustable-table-format" style="background-color:#e5f1fb;border-radius:8px;border:1px solid #d4e0ee;box-shadow:0 2px 8px rgba(50,50,50,0.04);font-family:Arial,sans-serif;margin:32px auto;padding:24px;">

        <tr>
          <th style="background-color:#f3f6fa;border:1px solid #e5e7eb;font-weight:bold;padding:8px 12px;text-align:left;">Temat</th>
          <th style="background-color:#f3f6fa;border:1px solid #e5e7eb;font-weight:bold;padding:8px 12px;text-align:left;">Szczegóły</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td style="border:1px solid #e5e7eb;padding:8px 12px;"><span>{{subject}}</span></td>
          <td style="border:1px solid #e5e7eb;padding:8px 12px;"><span>{{body}}</span></td>
        </tr>
      </tbody>
    </table>

</div>
